[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "replaylab"
version = "0.1.0"
description = "Reproduce webhook incidents, challenge fixes, and export evidence."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "contree-sdk==0.3.6", "pytest>=8,<10"]

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
replaylab = "replaylab.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
