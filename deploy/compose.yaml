services:
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args:
        REPLAYLAB_REVISION: ${REPLAYLAB_REVISION:-uncommitted}
        REPLAYLAB_SOURCE_CLEAN: ${REPLAYLAB_SOURCE_CLEAN:-false}
    restart: unless-stopped
    init: true
    env_file:
      - ${REPLAYLAB_ENV_FILE:-/srv/replaylab/runtime.env}
    environment:
      REPLAYLAB_DATA_DIR: /data
      REPLAYLAB_PUBLIC_DEMO: "true"
      REPLAYLAB_SECURE_COOKIE: "true"
    volumes:
      - ${REPLAYLAB_DATA_ROOT:-/srv/replaylab}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      REPLAYLAB_DOMAIN: ${REPLAYLAB_DOMAIN:?Set the DNS hostname for the public demo}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REPLAYLAB_DATA_ROOT:-/srv/replaylab}/caddy-data:/data
      - ${REPLAYLAB_DATA_ROOT:-/srv/replaylab}/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
